[package]
name = "tp"
description = "A command-line tool for managing and loading tmux sessions from configuration files"
version = "1.0.0"
edition = "2024"
authors = ["Emerson Max de Medeiros Silva <emersonmx@gmail.com>"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
insta = "1.47"
rstest = "0.26"
temp-env = "0.3"
tempfile = "3.20"
